name: CI & Generation Queue
on:
  pull_request:
    paths:
      - 'platform/**'
      - 'syda/**'
      - 'tests/**'
      - '.github/workflows/generation-queue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: syda_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/syda_test
      PYTHONPATH: platform/backend:.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --project platform/backend --extra test
      - name: Dependency lock changes
        run: git diff -- platform/backend/uv.lock
      - name: Backend and core tests
        run: uv run --project platform/backend pytest tests/ platform/backend/tests/

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          cd platform/frontend
          npm ci
      - name: Frontend typecheck
        run: |
          cd platform/frontend
          npm run typecheck
      - name: Frontend production build
        run: |
          cd platform/frontend
          npm run build
