name: Deploy staging
run-name: Manual staging deployment by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy (blank uses the repository default branch)
        type: string
        required: false
      pr:
        description: Open same-repository PR number (leave branch blank)
        type: string
        required: false
      deploy:
        description: Deploy after publishing (disable for first-time GHCR package setup)
        type: boolean
        default: true

permissions: {}

# Shared staging is deliberately a single slot. Pending runs may be superseded
# by GitHub; a running deployment is never cancelled by a newer dispatch.
concurrency:
  group: dokploy-shared-staging
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Require the default branch deployment controller
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo '::error::Run this workflow from the repository default branch. Select the deployment source using the branch or PR input.'
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve selected source without executing it
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_PR: ${{ inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/deploy_staging.py resolve

  build:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/build-staging-images.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      upload_artifact: true

  publish:
    name: Publish built images from a fresh runner
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.publish.outputs.backend }}
      frontend: ${{ steps.publish.outputs.frontend }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-images
          path: ${{ runner.temp }}/images
      - name: Push images and record immutable digests
        id: publish
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          docker load --input "$RUNNER_TEMP/images/staging-images.tar.gz"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repo="${GITHUB_REPOSITORY,,}"
          for service in backend frontend; do
            image="ghcr.io/$repo-staging-$service"
            tag="$image:$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker tag "syda-staging-$service:build" "$tag"
            docker push "$tag"
            digest=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
            [[ "$digest" =~ ^ghcr.io/.+@sha256:[0-9a-f]{64}$ ]]
            printf '%s=%s\n' "$service" "$digest" >> "$GITHUB_OUTPUT"
          done
          docker logout ghcr.io

  deploy:
    name: Deploy staging commit ${{ needs.resolve.outputs.sha }}
    needs: [resolve, publish]
    if: inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    permissions:
      contents: write # Atomic deployment lock, surviving runner cancellation.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy exact commit and verify staging health
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          DOKPLOY_URL: ${{ vars.STAGING_DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          DOKPLOY_COMPOSE_ID: ${{ vars.STAGING_DOKPLOY_COMPOSE_ID }}
          DOKPLOY_ENVIRONMENT_ID: ${{ vars.STAGING_DOKPLOY_ENVIRONMENT_ID }}
          STAGING_API_HEALTH_URL: ${{ vars.STAGING_API_HEALTH_URL }}
          STAGING_WEB_HEALTH_URL: ${{ vars.STAGING_WEB_HEALTH_URL }}
          STAGING_BACKEND_IMAGE: ${{ needs.publish.outputs.backend }}
          STAGING_FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend }}
        run: python3 scripts/deploy_staging.py deploy
