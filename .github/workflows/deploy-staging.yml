name: Deploy staging
run-name: Manual staging deployment by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy (blank uses the repository default branch)
        type: string
        required: false
      pr:
        description: Open same-repository PR number (leave branch blank)
        type: string
        required: false

permissions: {}

# Shared staging is deliberately a single slot. Pending runs may be superseded
# by GitHub; a running deployment is never cancelled by a newer dispatch.
concurrency:
  group: dokploy-shared-staging
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Require the default branch deployment controller
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo '::error::Run this workflow from the repository default branch. Select the deployment source using the branch or PR input.'
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve selected source without executing it
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_PR: ${{ inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/deploy_staging.py resolve

  deploy:
    name: Deploy staging commit ${{ needs.resolve.outputs.sha }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    permissions:
      contents: write # Create immutable source snapshots and the durable lock.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy exact commit and verify staging health
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          DOKPLOY_URL: ${{ vars.STAGING_DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.STAGING_DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.STAGING_DOKPLOY_COMPOSE_ID }}
          DOKPLOY_ENVIRONMENT_ID: ${{ vars.STAGING_DOKPLOY_ENVIRONMENT_ID }}
          STAGING_API_HEALTH_URL: ${{ vars.STAGING_API_HEALTH_URL }}
          STAGING_WEB_HEALTH_URL: ${{ vars.STAGING_WEB_HEALTH_URL }}
          STAGING_ISOLATION_CONFIRMED: ${{ vars.STAGING_ISOLATION_CONFIRMED }}
        run: python3 scripts/deploy_staging.py deploy
