name: Publish Docker Images

on:
  push:
    branches:
      - main
      - feat/web-platform
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name for Image Tags
        id: repo_name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}-backend:latest
            ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: platform/frontend
          file: platform/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}-frontend:latest
            ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add Publish Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 🐳 Docker Images Published to GHCR

          * **Triggered by:** @${{ github.actor }}
          * **Commit:** `${{ github.sha }}`
          * **Backend Image:** `ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}-backend:latest`
          * **Frontend Image:** `ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}-frontend:latest`

          These container images are publicly available and ready for deployment on GCP, Kubernetes, or any standard container host.
          EOF
