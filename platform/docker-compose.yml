services:
  postgres:
    image: postgres:16-alpine
    container_name: syda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syda}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-syda}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: &backend_build
      context: ..
      dockerfile: platform/backend/Dockerfile
    container_name: syda-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment: &backend_environment
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-syda}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    env_file: &backend_env_file
      - path: ./backend/.env
        required: false
    volumes: &backend_volumes
      - job_data:/app/platform/backend/data/jobs
      - settings_data:/app/platform/backend/data/settings
    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: *backend_build
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--queues=generation"]
    environment: *backend_environment
    env_file: *backend_env_file
    volumes: *backend_volumes
    stop_grace_period: 65s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  dispatcher:
    build: *backend_build
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "app.dispatcher"]
    environment: *backend_environment
    env_file: *backend_env_file
    volumes: *backend_volumes
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syda-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  job_data:
  settings_data:
  redis_data:
